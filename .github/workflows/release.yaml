name: Release CEF Artifacts

on:
  push:
    branches:
      - release/v*

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows
            os: windows-latest
            url: "https://cef-builds.spotifycdn.com/cef_binary_132.3.2%2Bg4997b2f%2Bchromium-132.0.6834.161_windows64_minimal.tar.bz2"
            archive_name: cef_windows64.tar.bz2
            artifact_name: cef-windows-x86_64
            compress_cmd: "7z a -tzip"
            mkdir_cmd: "mkdir"
            
          - platform: macos
            os: macos-latest
            url: "https://cef-builds.spotifycdn.com/cef_binary_132.3.2%2Bg4997b2f%2Bchromium-132.0.6834.161_macosarm64_minimal.tar.bz2"
            archive_name: cef_macosarm64.tar.bz2
            artifact_name: cef-macos-arm64
            compress_cmd: "zip -r"
            mkdir_cmd: "mkdir -p"
            curl_opts: "--http1.1 --retry 3 --retry-delay 10 --connect-timeout 60 --max-time 3600"
            
          - platform: linux
            os: ubuntu-latest
            url: "https://cef-builds.spotifycdn.com/cef_binary_132.3.2%2Bg4997b2f%2Bchromium-132.0.6834.161_linux64_minimal.tar.bz2"
            archive_name: cef_linux64.tar.bz2
            artifact_name: cef-linux-x86_64
            compress_cmd: "zip -r"
            mkdir_cmd: "mkdir -p"
            
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create artifacts directory
      run: ${{ matrix.mkdir_cmd }} ./artifacts
      
    - name: Download CEF build
      run: |
        curl -L ${{ matrix.curl_opts }} "${{ matrix.url }}" -o ./artifacts/${{ matrix.archive_name }}
          
    - name: Extract archive
      run: |
        cd ./artifacts
        tar -xjf ${{ matrix.archive_name }}
        mv cef_binary_*/* .
        rmdir cef_binary_*
        ls ../artifacts
        
    - name: Process CEF artifacts
      run: cargo cef-artifacts
      
    - name: Create artifact
      run: |
        cd ./artifacts/cef
        ${{ matrix.compress_cmd }} ../${{ matrix.artifact_name }}.zip *
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./artifacts/${{ matrix.artifact_name }}.zip

